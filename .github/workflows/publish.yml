name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install build
      - run: python -m build

      # Uses trusted publishing (OIDC) — no token needed if configured on PyPI
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
